name: Build Desktop (Windows & macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release notes and scripts
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Download verified Windows installers
        uses: actions/download-artifact@v8.0.2
        with:
          name: BytePet-windows-x64-${{ github.run_number }}
          path: artifacts/windows-x64

      - name: Download verified Intel Mac installers
        uses: actions/download-artifact@v8.0.2
        with:
          name: BytePet-macos-x86_64-${{ github.run_number }}
          path: artifacts/macos-x86_64

      - name: Download verified Apple Silicon Mac installers
        uses: actions/download-artifact@v8.0.2
        with:
          name: BytePet-macos-arm64-${{ github.run_number }}
          path: artifacts/macos-arm64

      - name: Check all package checksums and prepare release assets
        run: node scripts/prepare-release-assets.mjs

      - name: Publish release with version comparison notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: x86_64-pc-windows-msvc
          cache-on-failure: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop configuration
        run: pnpm check:desktop

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import assert from "node:assert/strict"; import fs from "node:fs"; assert.equal(process.env.RELEASE_TAG, "v" + JSON.parse(fs.readFileSync("package.json", "utf8")).version);'

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint frontend
        run: pnpm lint

      - name: Test frontend
        run: pnpm test

      - name: Test Rust on Windows
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target "$env:TARGET"

      - name: Test Windows native credential storage
        timeout-minutes: 5
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target "$env:TARGET" native_credential_round_trip -- --ignored

      - name: Build Windows EXE and MSI installers
        run: pnpm tauri build --ci --target "$env:TARGET" --bundles nsis,msi -- --locked

      - name: Verify executable and package artifacts
        run: ./scripts/windows-verify-bundle.ps1 -Target "$env:TARGET"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7.0.2
        with:
          name: BytePet-windows-x64-${{ github.run_number }}
          path: |
            artifacts/windows-x64/*.exe
            artifacts/windows-x64/*.msi
            artifacts/windows-x64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload isolated startup diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: BytePet-windows-x64-startup-${{ github.run_number }}
          path: artifacts/windows-x64/startup.*.log
          if-no-files-found: ignore
          retention-days: 7

  build-macos:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            target: x86_64-apple-darwin
            arch: x86_64
            runner: macos-15-intel
          - label: macOS Apple Silicon
            target: aarch64-apple-darwin
            arch: arm64
            runner: macos-15

    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop configuration and native plist
        run: |
          pnpm check:desktop
          plutil -lint src-tauri/Info.macos.plist

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          test "$RELEASE_TAG" = "v$version"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint frontend
        run: pnpm lint

      - name: Test frontend
        run: pnpm test

      - name: Test Rust on native architecture
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target "$TARGET"

      - name: Test native credential storage in isolated keychain
        timeout-minutes: 5
        run: bash scripts/macos-keychain-test.sh

      - name: Build ad-hoc signed macOS test packages
        run: pnpm tauri build --ci --target "$TARGET" --bundles app,dmg -- --locked

      - name: Verify bundle and package artifacts
        run: bash scripts/macos-verify-bundle.sh "$TARGET" "${{ matrix.arch }}"

      - name: Upload installers and permission-preserving app archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: BytePet-macos-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            artifacts/macos-${{ matrix.arch }}/*.dmg
            artifacts/macos-${{ matrix.arch }}/*.app.zip
            artifacts/macos-${{ matrix.arch }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload isolated startup diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: BytePet-macos-${{ matrix.arch }}-startup-${{ github.run_number }}
          path: artifacts/macos-${{ matrix.arch }}/startup.log
          if-no-files-found: ignore
          retention-days: 7
